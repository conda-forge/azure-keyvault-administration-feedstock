schema_version: 1

context:
  name: azure-keyvault-administration
  version: "4.8.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/azure_keyvault_administration-${{ version }}.tar.gz
  sha256: 9df0d0948802483490b7c020595eaed5cd4ddf1470606b657abf63b29159188e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - setuptools
    - python ${{ python_min }}.*
    - pip
  run:
    - python >=${{ python_min }}
    - azure-core >=1.31.0
    - isodate >=0.6.1
    - typing_extensions >=4.6.0

tests:
  - python:
      imports:
        - azure.keyvault.administration
        - azure.keyvault.administration._generated
      pip_check: true
      python_version: ${{ python_min }}.*
about:
  summary: Microsoft Azure Key Vault Administration Client Library for Python
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/Azure/azure-sdk-for-python/tree/main/sdk/keyvault/azure-keyvault-administration

extra:
  recipe-maintainers:
    - janjagusch
